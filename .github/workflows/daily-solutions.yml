name: Daily algorithm solutions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-solutions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and commit 1-3 solutions with one-hour intervals
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          count=$((RANDOM % 3 + 1))
          echo "Сегодня будет создано коммитов: $count"

          for ((index=1; index<=count; index++)); do
            echo "Генерация решения $index/$count"
            TASK_COUNT=1 node scripts/generate-solutions.mjs
            git add solutions/
            git commit -m "chore: add daily algorithm solution $index/$count"
            git push

            if [ "$index" -lt "$count" ]; then
              echo "Ожидание 1 час до следующего решения"
              sleep 3600
            fi
          done
